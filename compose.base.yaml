# Shared services for the party demo stacks. Every stack is started with:
#   docker compose -f compose.base.yaml -f compose.<mode>.yaml
services:
  app:
    image: party-mastering-app:dev
    expose:
      - "8080"

  pip:
    image: party-mastering-pip:dev
    command: ["-runtime-config", "/etc/controls/pip.yaml"]
    volumes:
      - ./pip/pip.yaml:/etc/controls/pip.yaml:ro
    expose:
      - "8082"
