name: party-mastering-service-signed

services:
  sidecar:
    image: ${CONTROLS_SIDECAR_IMAGE:-party-mastering-sidecar:dev}
    ports:
      - "18008:8080"
    environment:
      CONTROLS_RUNTIME_CONFIG: /etc/controls/sidecar.signed.yaml
      CONTROLS_IDENTITY_HMAC_KEY: ${CONTROLS_IDENTITY_HMAC_KEY:?set CONTROLS_IDENTITY_HMAC_KEY for signed mode}
      SERVICE_NAME: party-mastering-signed
    volumes:
      - ./.tmp/signed/bundle:/etc/controls/bundle:ro
      - ./.tmp/signed/keys/bundle-signing.pub.pem:/etc/controls/keys/bundle-signing.pub.pem:ro
      - ./envoy/envoy.yaml:/etc/controls/envoy.yaml:ro
      - ./sidecar.signed.yaml:/etc/controls/sidecar.signed.yaml:ro
    depends_on:
      - app
      - pip
